# Render Blueprint: https://render.com/docs/blueprint-spec
# Monorepo: Python API at repo root, JyotishAI web app in frontend/
services:
  - type: web
    name: pyjhora-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: AWS_REGION
        value: ap-south-1
      - key: DYNAMODB_PROFILES_CHARTS_TABLE_NAME
        value: JyotishProfilesCharts
      - key: DYNAMODB_USERS_TABLE_NAME
        value: JyotishUsers
      - key: DYNAMODB_PROFILES_TABLE_NAME
        value: JyotishProfiles
      - key: JWT_SECRET
        sync: false
      - key: AUTH_OTP_PEPPER
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini

  - type: web
    name: jyotishai-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.21.1"
      - key: VITE_PYJHORA_API_BASE
        value: https://pyjhora-api-8ni1.onrender.com
